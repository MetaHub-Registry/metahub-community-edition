version: '3'

dotenv: ['.env']
tasks:
  default:
    cmds:
      - task: rules
      - task: profiles
      - task: manifests
      - task: collections
      - task: compute:manifests
      - task: compute:manifestlists 
  rules:
    cmds:
      - |
        metahub-admin --config ${CONFIG_FILE} parse rules --empty-graph=all \
          ./rules/cpu/generic.yaml \
          ./rules/os/linux.yaml \
          ./rules/cpu/zen2.yaml \
          ./rules/cpu/noop.yaml
  profiles:
    cmds:
      - |
       metahub-admin --config ${CONFIG_FILE} parse profiles \
         ./profiles/generic.yaml \
         ./profiles/cpu/zen2.yaml
  manifests:
    cmds:
      - metahub-admin --config ${CONFIG_FILE} parse manifests ./collections/qnib/ftest/latest.yaml
  collections:
    cmds:
      - metahub-admin --config ${CONFIG_FILE} parse collections ./collections/qnib/ftest/latest.yaml  
  compute:*:
    vars:
      TYPE: '{{index .MATCH 0}}'
    preconditions:
      - sh: '[ "{{.TYPE}}" = "manifests" ] || [ "{{.TYPE}}" = "manifestlists" ]'
        msg: "compute type must be one of: manifests, manifestlists"
    cmds:
      - metahub-admin --config ${CONFIG_FILE} compute {{ .TYPE }}