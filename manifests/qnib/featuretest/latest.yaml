manifests:
  - name: qnib/featuretest
    tag: latest
    manifests:
      - image: docker.io/qnib/plain-featuretest:generic
      - image: quay.io/cqnib/plain-featuretest:arch-cascadelake
        platform: 
          features: [cpu:cascadelake]
      - image: docker.io/qnib/plain-featuretest:arch-skylake
        platform: 
          features: [cpu:skylake]
      - image: quay.io/cqnib/plain-featuretest:arch-skylake_avx512
        platform: 
          features: [cpu:skylake_avx512]
      - image: quay.io/cqnib/plain-featuretest:arch-zen
        platform: 
          features: [cpu:zen]
      - image: quay.io/cqnib/plain-featuretest:arch-zen2
        platform: 
          features: [cpu:zen2]
      - image: quay.io/cqnib/plain-featuretest:arch-zen3
        platform: 
          features: [cpu:zen3]
      - image: quay.io/cqnib/plain-featuretest:cpu-broadwell
        platform: 
          features: [cpu:broadwell]
