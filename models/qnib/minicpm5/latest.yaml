# Declarative model entry (models/ type) for model-centric pull.
# Served as models/qnib/minicpm5:<quant>; composed per requesting profile as
# weights(quant) + runtime(collection) + config. See the MetaHub-Registry/openspec change model-centric-pull.
#
# NOTE: `runtime` references an in-metahub collection (collections/qnib/llama-server);
# override rules (latest/config) use lep grammar — single `=`, NOT `==`.
name: qnib/minicpm5
runtime: qnib/llama-server
quants:
  # The community edition does not host model weights. Replace this placeholder
  # with an OCI reference to a model image in a registry you control.
  # Model weights carry their own licence, independent of this repository's
  # Apache-2.0; check the model card before redistributing them.
  - { tag: q8-0, source: registry.example.com/models/minicpm5:q8-0 }
latest:
  default: best-fit
  overrides:
    - { rule: "hardware.gpu.vram_gb >= 100", quant: q8-0 }
config:
  default: { ctx_size: 32768, kv_cache_type: q8_0 }
  overrides:
    - { profile: frame, config: { ctx_size: 65536 } }
