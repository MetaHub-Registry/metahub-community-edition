label: layer/glow#1.5.0
# Extended schema (defaults + rule-keyed variants). Both quay.io upstream
# images keep the same binary but ship per-arch — hence the variants map.
#
# The legacy flat form was:
#   layers:
#     - image: quay.io/cqnib/metahub-layers/hpc3/glow:1.5.0-arm64
#       rule: arch:arm64=true
#     - image: quay.io/cqnib/metahub-layers/hpc3/glow:1.5.0-amd64
#       rule: arch:amd64=true
variants:
  "arch:arm64=true":
    layers:
      - image: quay.io/cqnib/metahub-layers/hpc3/glow:1.5.0-arm64
  "arch:amd64=true":
    layers:
      - image: quay.io/cqnib/metahub-layers/hpc3/glow:1.5.0-amd64
