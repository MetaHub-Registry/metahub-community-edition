label: layer/glow-extended#2.1.2
# Extended manipulation sample — shows how the new schema can carry env,
# workdir, user, volumes and entrypoint/cmd mutations alongside per-arch
# layer variants.
env:
  HPC3_HELP: /usr/share/hpc3/help.md
workdir: /tmp
user: "1000:1000"
volumes:
  - /data
entrypoint:
  op: replace
  value:
    - /usr/bin/hpc3-help
cmd:
  op: replace
  value:
    - "echo HelloWorld"
variants:
  "arch:arm64=true":
    layers:
      - image: registry.gitlab.com/qnib-pub-containers/layers/glow/base:arm64-2026-04-19.1
  "arch:amd64=true":
    layers:
      - image: registry.gitlab.com/qnib-pub-containers/layers/glow/base:amd64-2026-04-19.1
    env:
      GLOW_SIMD: AMD64
    cmd:
      op: replace
      value:
        - "echo HelloAMD64"
